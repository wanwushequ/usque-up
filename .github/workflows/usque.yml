name: Generate and Upload

on:
  #schedule:
    #- cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y unzip curl
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -o awscliv2.zip
          sudo ./aws/install --update

      - name: Download and Extract usque
        run: |
          curl -L -o usque.zip https://github.com/Diniboy1123/usque/releases/download/v3.0.1/usque_3.0.1_linux_amd64.zip
          unzip usque.zip
          chmod +x usque

      - name: Batch Register and Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          AWS_REGION: auto
        run: |
          set +e
          # 随机生成 8~15 个
          COUNT=$((RANDOM % 8 + 8))
          echo "本次将生成 $COUNT 个账号"
          
          # 初始化计数器
          SUCCESS_COUNT=0
          
          for i in $(seq 1 $COUNT); do
            FILE_ID=$(uuidgen || cat /proc/sys/kernel/random/uuid)
            echo "y" | ./usque register > /dev/null 2>&1
          
            if [ -f "config.json" ]; then
              # 插入 MASQUE 导航字段
              jq '. + {"MASQUE导航": "https://masque.pages.dev/"}' config.json > config.tmp.json
              mv config.tmp.json config.json
              
              mv config.json "${FILE_ID}.json"
              aws s3 cp "${FILE_ID}.json" "s3://${{ secrets.R2_BUCKET_NAME }}/accounts/${FILE_ID}.json" --endpoint-url "$AWS_ENDPOINT_URL" > /dev/null 2>&1
              
              DISPLAY_ID="${FILE_ID:0:8}********${FILE_ID: -8}"
              echo "✅ 成功上传: ${DISPLAY_ID}"
              
              rm "${FILE_ID}.json"
              SLEEP_TIME=$((RANDOM % 3 + 1))
              echo "休眠 ${SLEEP_TIME}s"
              sleep $SLEEP_TIME
              
              # 成功计数 +1
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            else
              echo "❌ 第 $i 次注册中断（config.json 未生成）"
              break
            fi
          done
          
          echo "========== 执行完成 =========="
          echo "📊 统计信息："
          echo "   - 计划注册: $COUNT 个"
          echo "   - 成功上传: $SUCCESS_COUNT 个"
          echo "   - 失败: $((COUNT - SUCCESS_COUNT)) 个"
          
          # 如果成功数为0，标记为失败
          if [ $SUCCESS_COUNT -eq 0 ]; then
            echo "❌ 所有账号生成失败！"
            exit 1
          else
            echo "✅ 任务完成！"
          fi
