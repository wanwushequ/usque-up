name: test

on:
  schedule:
    - cron: '0 * * * *' 
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y unzip curl jq
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -o awscliv2.zip
          sudo ./aws/install --update

      - name: Download and Extract warpscout
        run: |
          curl -L -o warpscout.tar.gz https://github.com/vernette/warpscout/releases/download/v0.15.0/warpscout_0.15.0_linux_amd64.tar.gz
          tar -xzf warpscout.tar.gz
          chmod +x warpscout
          ./warpscout --version || true

      - name: UP2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          AWS_REGION: auto
        run: |
          set +e
          # COUNT=$((RANDOM % 8 + 8))
          COUNT=6
          echo "本次计划 $COUNT 个"

          SUCCESS_COUNT=0

          for i in $(seq 1 $COUNT); do
            FILE_ID=$(uuidgen || cat /proc/sys/kernel/random/uuid)
            # 仓库文件名隐去中间：前8 + ******** + 后8
            SAFE_ID="${FILE_ID:0:8}------${FILE_ID: -8}"
            echo "===== 第 $i 次，FILE_ID=${SAFE_ID} ====="

            rm -f warpscout-account.json config.json

            ./warpscout register > /dev/null 2>&1
            RET=$?
            echo "register 退出码: $RET"

            if [ ! -f "warpscout-account.json" ]; then
              echo "❌ 第 $i 次未生成 warpscout-account.json，中断"
              break
            fi

            python3 - <<'PY'
          import json, collections, sys
          src = "warpscout-account.json"
          dst = "config.json"
          try:
              with open(src, "r", encoding="utf-8") as f:
                  a = json.load(f)
          except Exception as e:
              print("source read failed:", e)
              sys.exit(1)

          m = a.get("masque") or {}
          o = a.get("outer") or {}

          out = collections.OrderedDict()

          if m:
              out["private_key"]      = str(m.get("private_key", "") or "")
              out["endpoint_v4"]      = "162.159.198.2"
              out["endpoint_v6"]      = "2606:4700:103::2"
              out["endpoint_h2_v4"]   = "162.159.198.2"
              out["endpoint_h2_v6"]   = ""
              out["endpoint_pub_key"] = str(m.get("peer_public_key", "") or "")
              out["license"]          = ""
              out["id"]               = str(m.get("id", "") or "")
              out["access_token"]     = str(m.get("token", "") or "")
              out["ipv4"]             = str(m.get("ipv4", "") or "")
              out["ipv6"]             = str(m.get("ipv6", "") or "")

          out["wg_id"]              = str(a.get("id", "") or "")
          out["wg_token"]           = str(a.get("token", "") or "")
          out["wg_private_key"]     = str(a.get("private_key", "") or "")
          out["wg_peer_public_key"] = str(a.get("peer_public_key", "") or "")
          out["wg_ipv4"]            = str(a.get("ipv4", "") or "")
          out["wg_ipv6"]            = str(a.get("ipv6", "") or "")

          if o:
              out["awg_id"]              = str(o.get("id", "") or "")
              out["awg_token"]           = str(o.get("token", "") or "")
              out["awg_private_key"]     = str(o.get("private_key", "") or "")
              out["awg_peer_public_key"] = str(o.get("peer_public_key", "") or "")
              out["awg_ipv4"]            = str(o.get("ipv4", "") or "")
              out["awg_ipv6"]            = str(o.get("ipv6", "") or "")

          out["MASQUE导航"] = "https://masque.pages.dev/"

          with open(dst, "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)

          print("written:", dst)
          PY

            if [ ! -f "config.json" ]; then
              echo "❌ 第 $i 次转换 config.json 失败，中断"
              break
            fi

            rm -f warpscout-account.json

            # 用隐去中间的文件名，避免完整 UUID 出现在仓库里
            mv config.json "${SAFE_ID}.json"

            # ===== 上传 R2 / 提交仓库之前，先校验字段完整性 =====
            python3 - "$SAFE_ID" <<'PY'
          import json, sys
          fid = sys.argv[1]
          path = f"{fid}.json"
          try:
              with open(path, "r", encoding="utf-8") as f:
                  d = json.load(f)
          except Exception as e:
              print("READ_FAIL", e)
              sys.exit(2)

          # 必需字段：masque 一套 + wg 一套
          required = [
              "private_key", "endpoint_v4", "endpoint_v6",
              "endpoint_h2_v4", "endpoint_pub_key",
              "id", "access_token", "ipv4", "ipv6",
              "wg_id", "wg_token", "wg_private_key",
              "wg_peer_public_key", "wg_ipv4", "wg_ipv6",
          ]
          missing = [k for k in required if not str(d.get(k, "")).strip()]
          if missing:
              print("INCOMPLETE missing:", ",".join(missing))
              sys.exit(3)
          print("COMPLETE")
          PY
            CHECK=$?

            if [ $CHECK -ne 0 ]; then
              echo "⚠️ 第 $i 次字段不完整（校验码 $CHECK），删除该文件，不上传、不提交"
              rm -f "${SAFE_ID}.json"
              SLEEP_TIME=$((RANDOM % 3 + 1))
              echo "休眠 ${SLEEP_TIME}s"
              sleep $SLEEP_TIME
              continue
            fi

            # ===== 完整，才上传 R2（R2 用完整 UUID 路径）=====
            # aws s3 cp "${SAFE_ID}.json" "s3://${{ secrets.R2_BUCKET_NAME }}/accounts/${FILE_ID}.json" --endpoint-url "$AWS_ENDPOINT_URL" > /dev/null 2>&1
            echo "R2 上传退出码: $?"

            echo "✅ 成功上传: ${SAFE_ID}"

            SLEEP_TIME=$((RANDOM % 3 + 1))
            echo "休眠 ${SLEEP_TIME}s"
            sleep $SLEEP_TIME

            SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
          done

          # ===== 循环结束后，只提交完整且保留的 ${SAFE_ID}.json 到 json/ 文件夹 =====
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 确保 json 目录存在
          mkdir -p json

          for f in *.json; do
            [ -f "$f" ] || continue
            # 只处理形如 xxxxxxxx------yyyyyyyy.json 的隐去名文件
            if [[ "$f" =~ ^[0-9a-fA-F]{8}-{6}[0-9a-fA-F]{8}\.json$ ]]; then
              mv "$f" "json/$f"
              git add -f "json/$f"
            fi
          done

          git commit -m "up" || echo "无变化，跳过提交"
          git push || echo "推送失败，继续执行"

          echo "========== 执行完成 =========="
          echo "📊 统计信息："
          echo "   - 计划: $COUNT 个"
          echo "   - 成功: $SUCCESS_COUNT 个"
          echo "   - 失败: $((COUNT - SUCCESS_COUNT)) 个"

          if [ $SUCCESS_COUNT -eq 0 ]; then
            echo "❌ 全部失败！"
            exit 1
          else
            echo "✅ 任务完成！"
          fi
